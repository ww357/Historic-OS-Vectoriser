# Labelme config for cadastral map annotation.
# Passed to labelme via --config at launch.
#
# NOTE: if config.yaml defines a `taxonomy`, annotate.py replaces the `labels:` list below with
# the taxonomy classes. This list is only the fallback when there is no taxonomy.
#
# Example feature labels (type one of these as the shape label):
#   solid      → linestrip  — solid boundary lines (annotation.boundary_label in config.yaml)
#   dashed     → linestrip  — dashed/gappy boundary lines (parish bounds, tenure splits, etc.)
#   water      → polygon    — water features
#   building   → polygon    — building footprints
#   vegetation → polygon    — any land cover class symbology
#   damage     → polygon    — document damage / symbology cover
#   <text>     → polygon    — any other label is treated as a new feature class to finetune MapSAM

labels:
  - solid
  - dashed
  - water
  - building
  - damage

auto_save: false
keep_prev: false

shortcuts:
  create_linestrip: "L"
  create_polygon: "P"
